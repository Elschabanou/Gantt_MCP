services:
  - type: web
    name: gantt-mcp
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MCP_API_KEY
        sync: false
      - key: SERVER_URL
        sync: false
